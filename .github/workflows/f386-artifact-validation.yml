name: F386 artifact transport validation
on:
  push:
    branches: [audit/f386-artifact-validation]

permissions:
  contents: read

concurrency:
  group: f386-${{ github.ref }}
  cancel-in-progress: false

env:
  F386_RUN: ${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  upload:
    if: github.repository == 'seanchc418/desktop-assistant' && github.event.head_commit.message != 'Run approved ID 88 diagnostic once' && github.event.head_commit.message != 'Verify retained ID 88 artifact only'
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.fixture.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.store.outputs.artifact-id }}
      artifact_digest: ${{ steps.store.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate closed synthetic SQLite fixture
        id: fixture
        shell: pwsh
        run: node .github/scripts/f386-fixture.cjs create "$env:RUNNER_TEMP/f386-upload-$env:F386_RUN"
      - name: Upload only the two verified files
        id: store
        if: ${{ always() && steps.fixture.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f386-${{ github.run_id }}-${{ github.run_attempt }}-windows-2022
          path: |
            ${{ runner.temp }}/f386-upload-${{ env.F386_RUN }}/fixture.db
            ${{ runner.temp }}/f386-upload-${{ env.F386_RUN }}/manifest.json
          include-hidden-files: false
          if-no-files-found: error
          overwrite: false
          retention-days: 14
  verify:
    needs: upload
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm download and restore locations are unused
        shell: pwsh
        run: |
          if ((Test-Path -LiteralPath "$env:RUNNER_TEMP/f386-download-$env:F386_RUN") -or
              (Test-Path -LiteralPath "$env:RUNNER_TEMP/f386-restore-$env:F386_RUN")) { throw 'A verification directory already exists' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f386-${{ github.run_id }}-${{ github.run_attempt }}-windows-2022
          path: ${{ runner.temp }}/f386-download-${{ env.F386_RUN }}
      - name: Verify manifest, database bytes and restored rows
        env:
          MANIFEST_SHA256: ${{ needs.upload.outputs.manifest_sha256 }}
          ARTIFACT_ID: ${{ needs.upload.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.upload.outputs.artifact_digest }}
        shell: pwsh
        run: |
          if ($env:ARTIFACT_ID -notmatch '^\d+$' -or $env:ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') { throw 'Missing artifact metadata' }
          Write-Output "Artifact ID $env:ARTIFACT_ID SHA-256 $env:ARTIFACT_DIGEST"
          node .github/scripts/f386-fixture.cjs verify "$env:RUNNER_TEMP/f386-download-$env:F386_RUN" "$env:RUNNER_TEMP/f386-restore-$env:F386_RUN" "$env:MANIFEST_SHA256"


  identity:
    if: github.repository == 'seanchc418/desktop-assistant' && github.event.head_commit.message != 'Run approved ID 88 diagnostic once' && github.event.head_commit.message != 'Verify retained ID 88 artifact only'
    runs-on: windows-2022
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Verify two Windows identities and protect the synthetic WAL snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $collector = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $account = 'f386-' + [Guid]::NewGuid().ToString('N').Substring(0,12)
          $generated = 'Az9!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $password = ConvertTo-SecureString $generated -AsPlainText -Force
          Remove-Variable generated
          $worker = New-LocalUser -Name $account -Password $password -Description 'Disposable F386 synthetic test worker'
          $users = Get-LocalGroup -SID 'S-1-5-32-545'
          if (-not (Get-LocalGroupMember -Group $users | Where-Object SID -eq $worker.SID)) {
            Add-LocalGroupMember -Group $users -Member $worker
          }
          $root = Join-Path $env:SystemDrive ('/f386-canary-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'Canary path already exists' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($collector)
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($sid in @($collector, [Security.Principal.SecurityIdentifier]::new('S-1-5-18'))) {
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow'))
          }
          $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'ReadAndExecute','Allow'))
          Set-Acl -LiteralPath $root -AclObject $acl
          foreach ($dir in 'working','frozen','sealed','restore','control') {
            New-Item -ItemType Directory -Path (Join-Path $root $dir) | Out-Null
          }
          $control = Join-Path $root 'control/canary.bin'
          Set-Content -LiteralPath $control -Value 'synthetic worker control'
          $fileAcl = Get-Acl -LiteralPath $control
          $fileAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'Modify','Allow'))
          Set-Acl -LiteralPath $control -AclObject $fileAcl
          $controlDir = Join-Path $root 'control'
          $fileAcl = Get-Acl -LiteralPath $controlDir
          $fileAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'ReadAndExecute','Allow'))
          Set-Acl -LiteralPath $controlDir -AclObject $fileAcl
          $fixture = Join-Path $root 'fixture.cjs'
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { DatabaseSync } = require('node:sqlite');
          const { createHash } = require('node:crypto');
          const [phase, root] = process.argv.slice(2);
          const files = ['fixture.db','fixture.db-wal','fixture.db-shm'];
          const copy = (from, to) => files.forEach(file => fs.copyFileSync(path.join(root,from,file),path.join(root,to,file),fs.constants.COPYFILE_EXCL));
          if (phase === 'prepare') {
            const db = new DatabaseSync(path.join(root,'working',files[0]));
            try {
              db.exec("PRAGMA journal_mode=WAL; PRAGMA wal_autocheckpoint=0; CREATE TABLE synthetic(id INTEGER PRIMARY KEY, value TEXT NOT NULL); INSERT INTO synthetic VALUES(1,'synthetic-alpha'); PRAGMA wal_checkpoint(TRUNCATE); INSERT INTO synthetic VALUES(2,'synthetic-beta');");
              copy('working','frozen');
              copy('frozen','sealed');
            } finally { db.close(); }
          } else {
            assert.equal(phase,'restore');
            copy('sealed','restore');
            const db = new DatabaseSync(path.join(root,'restore',files[0]));
            try {
              const integrity = db.prepare('PRAGMA integrity_check').get().integrity_check;
              const schema = db.prepare("SELECT sql FROM sqlite_schema WHERE name='synthetic'").get().sql;
              const rows = db.prepare('SELECT id,value FROM synthetic ORDER BY id').all().map(({id,value}) => [id,value]);
              assert.equal(integrity,'ok');
              assert.equal(schema,'CREATE TABLE synthetic(id INTEGER PRIMARY KEY, value TEXT NOT NULL)');
              assert.deepEqual(rows,[[1,'synthetic-alpha'],[2,'synthetic-beta']]);
              const logicalSha256 = createHash('sha256').update(JSON.stringify({schema,rows})).digest('hex');
              console.log(JSON.stringify({integrity,schema,rowCount:rows.length,logicalSha256}));
            } finally { db.close(); }
          }
          '@ | Set-Content -LiteralPath $fixture -Encoding utf8
          node $fixture prepare $root
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic WAL generation failed' }
          $targets = foreach ($dir in 'frozen','sealed') {
            foreach ($name in 'fixture.db','fixture.db-wal','fixture.db-shm') { Join-Path $root "$dir/$name" }
          }
          $before = @($targets | Get-FileHash)
          $probe = Join-Path $root 'probe.ps1'
          @'
          param([string]$Root,[string]$ExpectedSid)
          $ErrorActionPreference = 'Stop'
          try {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            if ($identity.User.Value -ne $ExpectedSid -or $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Unexpected worker token' }
            Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          public static class F386Access {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            private static extern SafeFileHandle CreateFile(string p,uint a,uint s,IntPtr sa,uint d,uint f,IntPtr t);
            public static int Probe(string p,uint a) {
              using(var h=CreateFile(p,a,7,IntPtr.Zero,3,0x02200000,IntPtr.Zero)) {
                return h.IsInvalid ? Marshal.GetLastWin32Error() : 0;
              }
            }
          }
          "@
            function Check($Relative,$Mask,$Expected) {
              $actual = [F386Access]::Probe((Join-Path $Root $Relative),$Mask)
              if ($actual -ne $Expected) { throw "Unexpected Windows result $actual for $Relative mask $Mask (expected $Expected)" }
              Write-Output "$Relative mask $Mask -> $actual"
            }
            Check 'control/canary.bin' 2 0
            Check '.' 64 5
            foreach ($dir in 'frozen','sealed') {
              Check $dir 64 5
              Check $dir 65536 5
              foreach ($file in 'fixture.db','fixture.db-wal','fixture.db-shm') {
                foreach ($right in 2,4,65536,262144,524288) { Check "$dir/$file" $right 5 }
              }
            }
            Write-Output "Worker token verified: $($identity.User.Value); administrator=false"
            exit 0
          } catch { [Console]::Error.WriteLine($_.Exception.Message); exit 1 }
          '@ | Set-Content -LiteralPath $probe -Encoding utf8
          $probeAcl = Get-Acl -LiteralPath $probe
          $probeAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'ReadAndExecute','Allow'))
          Set-Acl -LiteralPath $probe -AclObject $probeAcl
          if ($collector -eq $worker.SID) { throw 'Identity separation failed' }
          $cred = [pscredential]::new("$env:COMPUTERNAME\$account",$password)
          $stdout = Join-Path $root 'worker.stdout'
          $stderr = Join-Path $root 'worker.stderr'
          $argsForWorker = '-NoProfile -NonInteractive -File "{0}" -Root "{1}" -ExpectedSid "{2}"' -f $probe,$root,$worker.SID.Value
          $process = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe') -ArgumentList $argsForWorker -Credential $cred -UseNewEnvironment -WorkingDirectory $root -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath $stdout
          if ($process.ExitCode -ne 0) { Get-Content -LiteralPath $stderr; throw 'Worker access verification failed' }
          node $fixture restore $root
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic WAL restore failed' }
          $after = @($targets | Get-FileHash)
          if (Compare-Object $before $after -Property Path,Hash) { throw 'Protected files changed' }
          Write-Output "Collector token: $($collector.Value); protected file hashes unchanged"
          $after | Select-Object Path,Hash | ConvertTo-Json -Compress


  wal_capture:
    if: github.repository == 'seanchc418/desktop-assistant' && github.event.head_commit.message != 'Run approved ID 88 diagnostic once' && github.event.head_commit.message != 'Verify retained ID 88 artifact only'
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 91daf54c96935a8b69a84d4f364a831ccf120d61
          path: f387-prisma-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          architecture: x64
      - name: Install locked packages and generate Prisma Client only
        shell: pwsh
        working-directory: f387-prisma-source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -cne '91daf54c96935a8b69a84d4f364a831ccf120d61') { throw 'Unexpected source' }
          $before = (Get-FileHash -LiteralPath 'package-lock.json').Hash
          if ((node --version) -cne 'v24.22.3' -or (npx.cmd --yes npm@11.6.2 --version) -cne '11.6.2') { throw 'Unexpected toolchain' }
          npx.cmd --yes npm@11.6.2 ci --ignore-scripts --no-audit --no-fund
          node node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
          if (-not (Test-Path -LiteralPath 'src/generated/prisma/client.ts' -PathType Leaf) -or (Get-FileHash -LiteralPath 'package-lock.json').Hash -cne $before) { throw 'Generated client missing or lockfile changed' }
          Write-Output "F387 setup Node v24.22.3 npm 11.6.2 lockfile SHA-256 $before"
      - name: Worker writes WAL, collector freezes and seals synthetic files
        id: seal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $collector = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $account = 'f386-' + [guid]::NewGuid().ToString('N').Substring(0,12)
          $password = ConvertTo-SecureString ('Az9!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))) -AsPlainText -Force
          $worker = New-LocalUser -Name $account -Password $password -Description 'Disposable synthetic WAL writer'
          $users = Get-LocalGroup -SID 'S-1-5-32-545'
          if (-not (Get-LocalGroupMember -Group $users | Where-Object SID -eq $worker.SID)) { Add-LocalGroupMember -Group $users -Member $worker }
          if ($collector -eq $worker.SID) { throw 'Identity collision' }
          $root = Join-Path $env:SystemDrive "/f386-chain-$tag"
          if (Test-Path -LiteralPath $root) { throw 'Workspace already exists' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($collector)
          $acl.SetAccessRuleProtection($true,$false)
          foreach ($sid in @($collector,[Security.Principal.SecurityIdentifier]::new('S-1-5-18'))) {
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow'))
          }
          $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'ReadAndExecute','Allow'))
          Set-Acl -LiteralPath $root -AclObject $acl
          $repo = Join-Path $env:GITHUB_WORKSPACE 'f387-prisma-source'
          $repoAcl = [Security.AccessControl.DirectorySecurity]::new()
          $repoAcl.SetOwner($collector)
          $repoAcl.SetAccessRuleProtection($true,$false)
          foreach ($sid in @($collector,[Security.Principal.SecurityIdentifier]::new('S-1-5-18'))) {
            $repoAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow'))
          }
          $repoAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'ReadAndExecute','ContainerInherit,ObjectInherit','None','Allow'))
          Set-Acl -LiteralPath $repo -AclObject $repoAcl
          $inbox = New-Item -ItemType Directory -Path (Join-Path $root 'inbox')
          $sealed = New-Item -ItemType Directory -Path (Join-Path $root 'sealed')
          $inboxAcl = Get-Acl -LiteralPath $inbox.FullName
          $inboxAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'Modify','ContainerInherit,ObjectInherit','None','Allow'))
          Set-Acl -LiteralPath $inbox.FullName -AclObject $inboxAcl
          $marker = Join-Path $sealed.FullName 'cleanup.marker'
          Set-Content -LiteralPath $marker -Value ([guid]::NewGuid().ToString('N')) -NoNewline
          $script = Join-Path $root 'producer.cjs'
          @'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const { DatabaseSync } = require('node:sqlite');
          const [inbox, marker, expectedUser, expectedSid, tag, repo] = process.argv.slice(2);
          assert.equal(os.userInfo().username.toLowerCase(), expectedUser.toLowerCase());
          assert(!process.env.GITHUB_TOKEN && !process.env.ACTIONS_RUNTIME_TOKEN);
          const whoami = path.join(process.env.SystemRoot,'System32','whoami.exe');
          const sid = execFileSync(whoami,['/user','/fo','csv','/nh'],{encoding:'utf8'});
          assert(sid.includes(expectedSid));
          const groups = execFileSync(whoami,['/groups','/fo','csv','/nh'],{encoding:'utf8'});
          assert(!groups.includes('S-1-5-32-544'));
          assert.throws(() => { const fd = fs.openSync(marker,'r+'); fs.closeSync(fd); }, { code: /^(EACCES|EPERM)$/ });
          assert.throws(() => { const fd = fs.openSync(path.join(repo,'package-lock.json'),'r+'); fs.closeSync(fd); }, { code: /^(EACCES|EPERM)$/ });
          const Module = require('node:module');
          const { pathToFileURL } = require('node:url');
          const fromRepo = Module.createRequire(path.join(repo,'package.json'));
          const generated = path.join(repo,'src/generated/prisma');
          const ts = fromRepo('typescript');
          const oldTs = Module._extensions['.ts'];
          Module._extensions['.ts'] = (mod, filename) => {
            const relative = path.relative(generated,filename);
            assert(relative && !path.isAbsolute(relative) && !relative.startsWith('..'));
            const result = ts.transpileModule(fs.readFileSync(filename,'utf8'),{compilerOptions:{module:ts.ModuleKind.CommonJS,target:ts.ScriptTarget.ES2022}});
            mod._compile(result.outputText,filename);
          };
          let PrismaClient;
          try { ({ PrismaClient } = fromRepo(path.join(generated,'client.ts'))); }
          finally { if (oldTs) Module._extensions['.ts']=oldTs; else delete Module._extensions['.ts']; }
          const { PrismaLibSql } = fromRepo('@prisma/adapter-libsql');
          const adapterPackage = path.join(repo,'node_modules/@prisma/adapter-libsql/package.json');
          const clientPackage = path.join(path.dirname(adapterPackage),'node_modules/@libsql/client/package.json');
          const resolvedClient = Module.createRequire(adapterPackage).resolve('@libsql/client');
          const version = filename => JSON.parse(fs.readFileSync(filename,'utf8')).version;
          assert.equal(version(adapterPackage),'7.10.0');
          assert.equal(version(path.join(repo,'node_modules/@prisma/client/package.json')),'7.10.0');
          assert.equal(version(clientPackage),'0.17.4');
          assert(resolvedClient.startsWith(path.dirname(clientPackage)+path.sep));
          assert.equal(version(path.join(repo,'node_modules/@libsql/win32-x64-msvc/package.json')),'0.5.29');
          console.log('F387 locked adapter 7.10.0, nested client 0.17.4, Windows native 0.5.29; worker source write denied');
          async function runFixture(mode) {
            const runId = tag + '-' + mode;
            const root = path.join(inbox, 'f387-id88-' + runId);
            fs.mkdirSync(root);
            const priorTemp = process.env.TEMP;
            process.env.TEMP = root;
            try {
              const canonical = fs.realpathSync(root);
              assert.equal(fs.realpathSync(os.tmpdir()), canonical);
              const dir = fs.mkdtempSync(path.join(canonical, 'db-v090-lift-'));
              const name = path.basename(dir);
              assert(/^db-v090-lift-[A-Za-z0-9]+$/.test(name));
              assert.equal(path.dirname(fs.realpathSync(dir)), canonical);
              const dbPath = path.join(dir, 'conversations.db');
              fs.writeFileSync(path.join(canonical, 'worker-handoff.json'), JSON.stringify({ version:1, runId, directory:name, fixture:'conversations.db' }), {flag:'wx'});
              fs.writeFileSync(path.join(dir, 'cleanup.marker'), 'synthetic '+runId, {flag:'wx'});
              let db;
              let initFailure = false;
              let finallyPreserved = false;
              let hookPreserved = false;
              async function openFixture() {
                const pending = new PrismaClient({ adapter:new PrismaLibSql({url:pathToFileURL(dbPath).href}) });
                try {
                  await pending.$connect();
                  if (mode === 'partial') {
                    await pending.$executeRawUnsafe('CREATE TABLE partial(id INTEGER PRIMARY KEY)');
                    await pending.$executeRawUnsafe('INSERT INTO partial VALUES(1)');
                    throw Error('synthetic initialization before client assignment');
                  }
                  return pending;
                } catch (error) { await pending.$disconnect(); throw error; }
              }
              try {
                db = await openFixture();
                const engine = (await db.$queryRawUnsafe('SELECT sqlite_version() AS version'))[0].version;
                console.log('F387 generated Prisma Client connected to native SQLite '+engine);
                await db.$queryRawUnsafe('PRAGMA journal_mode=WAL');
                await db.$queryRawUnsafe('PRAGMA wal_autocheckpoint=0');
                await db.$executeRawUnsafe('CREATE TABLE synthetic(id INTEGER PRIMARY KEY, value TEXT NOT NULL)');
                await db.$executeRawUnsafe("INSERT INTO synthetic VALUES(1,'checkpointed')");
                await db.$queryRawUnsafe('PRAGMA wal_checkpoint(TRUNCATE)');
                await db.$executeRawUnsafe("INSERT INTO synthetic VALUES(2,'wal-only')");
                assert.equal((await db.$queryRawUnsafe('SELECT id FROM synthetic ORDER BY id')).length,2);
                const candidate = path.join(dir, 'candidate');
                fs.mkdirSync(candidate);
                for (const suffix of ['', '-wal', '-shm']) fs.copyFileSync(dbPath+suffix,path.join(candidate,'conversations.db'+suffix),fs.constants.COPYFILE_EXCL);
              } catch (error) {
                if (mode !== 'partial' || db || error.message !== 'synthetic initialization before client assignment') throw error;
                initFailure = true;
              } finally {
                if (db) await db.$disconnect();
                // Exercise the diagnostic finally route, which delegates rather than deleting.
                assert(fs.statSync(dbPath).size > 0);
                assert(fs.existsSync(path.join(dir, 'cleanup.marker')));
                finallyPreserved = true;
              }
              // Exercise the outer hook with the diagnostic directory as its cleanup candidate.
              const preserveAfterEach = value => path.basename(value).startsWith('db-v090-lift-');
              if (!preserveAfterEach(dir)) throw Error('Outer cleanup did not preserve diagnostic directory');
              hookPreserved = fs.statSync(dbPath).size > 0 && fs.existsSync(path.join(dir,'cleanup.marker'));
              assert(hookPreserved);
              assert.equal(initFailure, mode === 'partial');
              return { mode, runId, directory:name, finallyPreserved, hookPreserved, initFailure };
            } finally { process.env.TEMP = priorTemp; }
          }
          assert(/^[0-9]+-[0-9]+$/.test(tag));
          (async () => {
            const handoffs = [await runFixture('success'),await runFixture('partial')];
            fs.writeFileSync(path.join(inbox,'handoff-report.json'),JSON.stringify({tag,handoffs}),{flag:'wx'});
            console.log('F387 Prisma registered before open; finally and afterEach preserved both fixtures; partial initialization failed before assignment');
          })().catch(error => { console.error(error); process.exitCode=1; });
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          $scriptAcl = Get-Acl -LiteralPath $script
          $scriptAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'ReadAndExecute','Allow'))
          Set-Acl -LiteralPath $script -AclObject $scriptAcl
          $nodeExe = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          if ((& $nodeExe --version) -cne 'v24.22.3') { throw 'Worker executable version mismatch' }
          $cred = [pscredential]::new("$env:COMPUTERNAME\$account",$password)
          $workerArgs = '"{0}" "{1}" "{2}" "{3}" "{4}" "{5}" "{6}"' -f $script,$inbox.FullName,$marker,$account,$worker.SID.Value,$tag,$repo
          $stdout = Join-Path $root 'worker.log'
          $stderr = Join-Path $root 'worker.err'
          $process = Start-Process -FilePath $nodeExe -ArgumentList $workerArgs -Credential $cred -UseNewEnvironment -WorkingDirectory $inbox.FullName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath $stdout
          if ($process.ExitCode -ne 0) { Get-Content -LiteralPath $stderr; throw 'Worker failed' }
          $names = 'conversations.db','conversations.db-wal','conversations.db-shm'
          function PlainItem($path, $directory) {
            $item = Get-Item -LiteralPath $path -Force
            if ($item.PSIsContainer -ne $directory -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unsafe handoff path' }
            return $item
          }
          [void](PlainItem $inbox.FullName $true)
          $handoffFile = PlainItem (Join-Path $inbox.FullName 'handoff-report.json') $false
          if ($handoffFile.Length -gt 4096) { throw 'Handoff report exceeds limit' }
          $report = Get-Content -LiteralPath $handoffFile.FullName -Raw | ConvertFrom-Json
          if ($report.tag -cne $tag -or $report.handoffs.Count -ne 2) { throw 'Invalid worker report' }
          $locations = @{}
          foreach ($mode in 'success','partial') {
            $runId = "$tag-$mode"
            $entry = @($report.handoffs | Where-Object mode -ceq $mode)
            if ($entry.Count -ne 1 -or $entry[0].runId -cne $runId -or -not $entry[0].finallyPreserved -or -not $entry[0].hookPreserved -or $entry[0].initFailure -ne ($mode -eq 'partial')) { throw 'Invalid cleanup proof' }
            $registeredRoot = PlainItem (Join-Path $inbox.FullName "f387-id88-$runId") $true
            $registrationFile = PlainItem (Join-Path $registeredRoot.FullName 'worker-handoff.json') $false
            if ($registrationFile.Length -gt 1024) { throw 'Registration exceeds limit' }
            $registration = Get-Content -LiteralPath $registrationFile.FullName -Raw | ConvertFrom-Json
            if ($registration.version -ne 1 -or $registration.runId -cne $runId -or $registration.fixture -cne 'conversations.db' -or $registration.directory -cnotmatch '^db-v090-lift-[A-Za-z0-9]+$' -or $registration.directory -cne $entry[0].directory) { throw 'Invalid registration' }
            $locations[$mode] = (PlainItem (Join-Path $registeredRoot.FullName $registration.directory) $true).FullName
            [void](PlainItem (Join-Path $locations[$mode] 'cleanup.marker') $false)
          }
          $candidate = PlainItem (Join-Path $locations.success 'candidate') $true
          $sourceFiles = @{}
          foreach ($name in $names) { $sourceFiles[$name] = Join-Path $candidate.FullName $name }
          $sourceFiles['partial-conversations.db'] = Join-Path $locations.partial 'conversations.db'
          $sourceFiles['partial-cleanup.marker'] = Join-Path $locations.partial 'cleanup.marker'
          $sourceFiles['handoff-report.json'] = $handoffFile.FullName
          $names = @($names + 'partial-conversations.db' + 'partial-cleanup.marker' + 'handoff-report.json')
          $held = @{}
          try {
            foreach ($name in $names) {
              $source = PlainItem $sourceFiles[$name] $false
              if ($source.PSIsContainer -or ($source.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $source.Length -le 0) { throw 'Invalid source' }
              $held[$name] = [IO.File]::Open($source.FullName,'Open','Read','Read')
            }
            foreach ($name in $names) {
              $destination = [IO.File]::Open((Join-Path $sealed.FullName $name),'CreateNew','Write','None')
              try { $held[$name].CopyTo($destination) } finally { $destination.Dispose() }
            }
          } finally { foreach ($stream in $held.Values) { $stream.Dispose() } }
          $items = foreach ($name in ($names + 'cleanup.marker')) {
            $file = Get-Item -LiteralPath (Join-Path $sealed.FullName $name)
            [ordered]@{ name=$name; bytes=$file.Length; sha256=(Get-FileHash -LiteralPath $file.FullName).Hash.ToLowerInvariant() }
          }
          $manifest = Join-Path $sealed.FullName 'manifest.json'
          [ordered]@{ tag=$tag; collectorSid=$collector.Value; workerSid=$worker.SID.Value; files=@($items) } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifest -Encoding utf8
          $hash = (Get-FileHash -LiteralPath $manifest).Hash.ToLowerInvariant()
          Write-Output "Collector SID $($collector.Value); source handles excluded writers and deleters during sealing; manifest SHA-256 $hash"
          "sealed=$($sealed.FullName)" >> $env:GITHUB_OUTPUT
          "sha=$hash" >> $env:GITHUB_OUTPUT
      - name: Publish sealed WAL source and marker
        id: archive
        if: ${{ always() && steps.seal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wal-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.seal.outputs.sha }}
          path: |
            ${{ steps.seal.outputs.sealed }}/conversations.db
            ${{ steps.seal.outputs.sealed }}/conversations.db-wal
            ${{ steps.seal.outputs.sealed }}/conversations.db-shm
            ${{ steps.seal.outputs.sealed }}/partial-conversations.db
            ${{ steps.seal.outputs.sealed }}/partial-cleanup.marker
            ${{ steps.seal.outputs.sealed }}/handoff-report.json
            ${{ steps.seal.outputs.sealed }}/cleanup.marker
            ${{ steps.seal.outputs.sealed }}/manifest.json
          retention-days: 14
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
      - name: Wait for the other runner's exact receipt before removing the original marker
        shell: pwsh
        env:
          SOURCE_ID: ${{ steps.archive.outputs.artifact-id }}
          MANIFEST_SHA: ${{ steps.seal.outputs.sha }}
          SEALED: ${{ steps.seal.outputs.sealed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $marker = Join-Path $env:SEALED 'cleanup.marker'
          $expected = "wal-receipt-$tag-$env:SOURCE_ID-$env:MANIFEST_SHA"
          $uri = "https://api.github.com/repos/seanchc418/desktop-assistant/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=30"
          function Valid($item) { return $null -ne $item -and $item.name -ceq $expected -and -not $item.expired -and $item.size_in_bytes -gt 0 -and $item.digest -match '^sha256:[a-f0-9]{64}$' }
          function ReleaseMarker($item, $permitRemoval) {
            if (-not (Valid $item)) { return $false }
            if (-not $permitRemoval) { throw 'Negative control unexpectedly matched receipt' }
            $localManifest = (Get-FileHash -LiteralPath (Join-Path $env:SEALED 'manifest.json')).Hash.ToLowerInvariant()
            if ($localManifest -cne $env:MANIFEST_SHA) { throw 'Local manifest changed; marker retained' }
            $manifest = Get-Content -LiteralPath (Join-Path $env:SEALED 'manifest.json') -Raw | ConvertFrom-Json
            foreach ($file in $manifest.files) {
              $hash = (Get-FileHash -LiteralPath (Join-Path $env:SEALED $file.name)).Hash.ToLowerInvariant()
              if ($hash -cne $file.sha256) { throw 'Sealed file changed; marker retained' }
            }
            Remove-Item -LiteralPath $marker
            if ((Test-Path -LiteralPath $marker) -or -not (Test-Path -LiteralPath (Join-Path $env:SEALED 'partial-cleanup.marker') -PathType Leaf)) { throw 'Cleanup marker disposition incorrect' }
            return $true
          }
          $wrong = @{ name="$expected-wrong"; expired=$false; size_in_bytes=100; digest=('sha256:' + '0'*64) }
          if ((ReleaseMarker $null $false) -or (ReleaseMarker $wrong $false) -or -not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw 'Missing or wrong receipt control failed' }
          Write-Output 'F387 cleanup gate rejected missing and wrong receipts; original marker preserved'
          $receipt = $null
          for ($i=0; $i -lt 16; $i++) {
            try { $published = Invoke-RestMethod -Uri $uri -TimeoutSec 8; $receipt = @($published.artifacts | Where-Object { Valid $_ }) | Select-Object -First 1 } catch { Write-Output 'Receipt listing temporarily unavailable' }
            if ($receipt) { break }
            Start-Sleep -Seconds 10
          }
          if (-not $receipt) { throw 'No matching remote receipt; marker preserved' }
          if (-not (ReleaseMarker $receipt $true)) { throw 'Receipt rejected; original marker preserved' }
          Write-Output "F387 receipt artifact $($receipt.id) confirmed; only original success marker removed; partial marker and sealed files retained"

  wal_verify:
    if: github.repository == 'seanchc418/desktop-assistant' && github.event.head_commit.message != 'Run approved ID 88 diagnostic once' && github.event.head_commit.message != 'Verify retained ID 88 artifact only'
    runs-on: windows-2022
    permissions: {}
    timeout-minutes: 14
    steps:
      - name: Wait for this run's sealed source
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $pattern = '^wal-source-' + [regex]::Escape($tag) + '-([0-9a-f]{64})$'
          $uri = "https://api.github.com/repos/seanchc418/desktop-assistant/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=30"
          $source = $null
          for ($i=0; $i -lt 50; $i++) {
            try { $published = Invoke-RestMethod -Uri $uri -TimeoutSec 8; $source = $published.artifacts | Where-Object { $_.name -cmatch $pattern -and -not $_.expired -and $_.size_in_bytes -gt 0 } | Select-Object -First 1 } catch { Write-Output 'Source listing temporarily unavailable' }
            if ($source) { break }
            Start-Sleep -Seconds 10
          }
          if (-not $source -or $source.name -cnotmatch $pattern) { throw 'No sealed source' }
          "name=$($source.name)" >> $env:GITHUB_OUTPUT
          "id=$($source.id)" >> $env:GITHUB_OUTPUT
          "sha=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Download the sealed source into an empty location
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.locate.outputs.name }}
          path: ${{ runner.temp }}/wal-source-${{ env.F386_RUN }}
      - name: Verify all bytes, restore WAL and confirm the WAL-dependent row
        id: check
        shell: pwsh
        env:
          SOURCE_ID: ${{ steps.locate.outputs.id }}
          MANIFEST_SHA: ${{ steps.locate.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $download = Join-Path $env:RUNNER_TEMP "wal-source-$env:F386_RUN"
          $manifest = Join-Path $download 'manifest.json'
          if ($env:SOURCE_ID -notmatch '^\d+$' -or (Get-FileHash -LiteralPath $manifest).Hash -ine $env:MANIFEST_SHA) { throw 'Manifest mismatch' }
          $doc = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($doc.tag -cne $tag -or $doc.collectorSid -ceq $doc.workerSid) { throw 'Manifest identity or run mismatch' }
          $names = @('conversations.db','conversations.db-wal','conversations.db-shm','partial-conversations.db','partial-cleanup.marker','handoff-report.json','cleanup.marker')
          if (@(Compare-Object @($names | Sort-Object) @($doc.files.name | Sort-Object) -CaseSensitive).Count) { throw 'Manifest inventory mismatch' }
          function VerifySet($directory) {
            foreach ($file in $doc.files) {
              $item = Get-Item -LiteralPath (Join-Path $directory $file.name)
              if ($item.PSIsContainer -or $item.Length -ne $file.bytes -or (Get-FileHash -LiteralPath $item.FullName).Hash -ine $file.sha256) { throw 'File integrity mismatch' }
            }
          }
          VerifySet $download
          $expectedArchive = @($names + 'manifest.json' | Sort-Object)
          if (@(Compare-Object $expectedArchive @(Get-ChildItem -LiteralPath $download -Force | Select-Object -ExpandProperty Name | Sort-Object) -CaseSensitive).Count) { throw 'Downloaded file inventory mismatch' }
          $handoff = Get-Content -LiteralPath (Join-Path $download 'handoff-report.json') -Raw | ConvertFrom-Json
          if ($handoff.tag -cne $tag -or $handoff.handoffs.Count -ne 2) { throw 'Downloaded handoff mismatch' }
          foreach ($mode in 'success','partial') {
            $entry = @($handoff.handoffs | Where-Object mode -ceq $mode)
            if ($entry.Count -ne 1 -or $entry[0].runId -cne "$tag-$mode" -or -not $entry[0].finallyPreserved -or -not $entry[0].hookPreserved -or $entry[0].initFailure -ne ($mode -eq 'partial')) { throw 'Downloaded handoff proof mismatch' }
          }
          $negative = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "wal-negative-$tag")
          foreach ($name in ($names | Where-Object { $_ -ne 'conversations.db-wal' })) { Copy-Item -LiteralPath (Join-Path $download $name) -Destination $negative.FullName }
          $missingRejected = $false
          try { VerifySet $negative.FullName } catch { $missingRejected = $_.CategoryInfo.Category -eq 'ObjectNotFound' }
          if (-not $missingRejected -or -not (Test-Path -LiteralPath (Join-Path $negative.FullName 'cleanup.marker') -PathType Leaf)) { throw 'Missing WAL case failed' }
          Write-Output 'F387 missing WAL rejected; negative fixture marker preserved'
          $checkScript = Join-Path $env:RUNNER_TEMP "wal-check-$tag.cjs"
          @'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { DatabaseSync } = require('node:sqlite');
          const { createHash } = require('node:crypto');
          const source = process.argv[2];
          function check(includeWal, expected) {
            const root = fs.mkdtempSync(path.join(os.tmpdir(),'f386-restore-'));
            for (const file of includeWal ? ['conversations.db','conversations.db-wal','conversations.db-shm'] : ['conversations.db']) fs.copyFileSync(path.join(source,file),path.join(root,file),fs.constants.COPYFILE_EXCL);
            const db = new DatabaseSync(path.join(root,'conversations.db'));
            try {
              const integrity = db.prepare('PRAGMA integrity_check').get().integrity_check;
              const schema = db.prepare("SELECT sql FROM sqlite_schema WHERE name='synthetic'").get().sql;
              const rows = db.prepare('SELECT id,value FROM synthetic ORDER BY id').all().map(({id,value})=>[id,value]);
              assert.equal(integrity,'ok');
              assert.equal(schema,'CREATE TABLE synthetic(id INTEGER PRIMARY KEY, value TEXT NOT NULL)');
              assert.deepEqual(rows,expected);
              return {integrity, schema, rows, logicalSha256:createHash('sha256').update(JSON.stringify({schema,rows})).digest('hex')};
            } finally { db.close(); }
          }
          const dbOnly = check(false,[[1,'checkpointed']]);
          const restored = check(true,[[1,'checkpointed'],[2,'wal-only']]);
          const partial = new DatabaseSync(path.join(source,'partial-conversations.db'),{readOnly:true});
          try {
            assert.equal(partial.prepare('PRAGMA integrity_check').get().integrity_check,'ok');
            assert.equal(partial.prepare('SELECT id FROM partial').get().id,1);
            assert(fs.statSync(path.join(source,'partial-cleanup.marker')).size > 0);
          } finally { partial.close(); }
          console.log(JSON.stringify({ dbOnly, restored, partialDatabaseAndMarkerPreserved:true }));
          '@ | Set-Content -LiteralPath $checkScript -Encoding utf8
          $result = node $checkScript $download
          if ($LASTEXITCODE -ne 0) { throw 'SQLite verification failed' }
          Write-Output $result
          $receipt = Join-Path $env:RUNNER_TEMP "wal-receipt-$tag.json"
          [ordered]@{ tag=$tag; artifactId=$env:SOURCE_ID; manifestSha256=$env:MANIFEST_SHA; restored=($result | ConvertFrom-Json) } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $receipt -Encoding utf8
          "file=$receipt" >> $env:GITHUB_OUTPUT
      - name: Publish exact successful verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wal-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.locate.outputs.id }}-${{ steps.locate.outputs.sha }}
          path: ${{ steps.check.outputs.file }}
          retention-days: 14
          if-no-files-found: error
          overwrite: false

  id88:
    if: github.repository == 'seanchc418/desktop-assistant' && github.event.head_commit.message == 'Run approved ID 88 diagnostic once' && github.run_attempt == 1
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 16
    outputs:
      archive_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha: ${{ steps.seal.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 91daf54c96935a8b69a84d4f364a831ccf120d61
          path: f387-prisma-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          architecture: x64
      - name: Install locked packages and generate Prisma Client only
        shell: pwsh
        working-directory: f387-prisma-source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -cne '91daf54c96935a8b69a84d4f364a831ccf120d61') { throw 'Unexpected source' }
          $before = (Get-FileHash -LiteralPath 'package-lock.json').Hash
          if ((node --version) -cne 'v24.22.3' -or (npx.cmd --yes npm@11.6.2 --version) -cne '11.6.2') { throw 'Unexpected toolchain' }
          npx.cmd --yes npm@11.6.2 ci --ignore-scripts --no-audit --no-fund
          node node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
          if (-not (Test-Path -LiteralPath 'src/generated/prisma/client.ts' -PathType Leaf) -or (Get-FileHash -LiteralPath 'package-lock.json').Hash -cne $before) { throw 'Generated client missing or lockfile changed' }
          Write-Output "F387 setup Node v24.22.3 npm 11.6.2 lockfile SHA-256 $before"
