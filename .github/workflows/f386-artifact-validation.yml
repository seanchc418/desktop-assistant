name: F386 artifact transport validation
on:
  push:
    branches: [audit/f386-artifact-validation]

permissions:
  contents: read

concurrency:
  group: f386-${{ github.ref }}
  cancel-in-progress: false

env:
  F386_RUN: ${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  id88:
    if: github.repository == 'seanchc418/desktop-assistant' && github.event.head_commit.message == 'Integrate approved ID 88 lifetime candidate once' && github.run_attempt == 1
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 16
    env:
      F387_GC_MODE: candidate
    outputs:
      archive_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha: ${{ steps.seal.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 91daf54c96935a8b69a84d4f364a831ccf120d61
          path: f387-prisma-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          architecture: x64
      - name: Install locked packages and generate Prisma Client only
        shell: pwsh
        working-directory: f387-prisma-source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -cne '91daf54c96935a8b69a84d4f364a831ccf120d61') { throw 'Unexpected source' }
          $before = (Get-FileHash -LiteralPath 'package-lock.json').Hash
          if ((node --version) -cne 'v24.22.3' -or (npx.cmd --yes npm@11.6.2 --version) -cne '11.6.2') { throw 'Unexpected toolchain' }
          npx.cmd --yes npm@11.6.2 ci --ignore-scripts --no-audit --no-fund
          node node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
          if (-not (Test-Path -LiteralPath 'src/generated/prisma/client.ts' -PathType Leaf) -or (Get-FileHash -LiteralPath 'package-lock.json').Hash -cne $before) { throw 'Generated client missing or lockfile changed' }
          Write-Output "F387 setup Node v24.22.3 npm 11.6.2 lockfile SHA-256 $before"
      - name: Run exactly ID 88 as a non-admin worker and seal allowlisted evidence
        id: seal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $collector = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $account = 'f386-' + [guid]::NewGuid().ToString('N').Substring(0,12)
          $password = ConvertTo-SecureString ('Az9!' + [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))) -AsPlainText -Force
          $worker = New-LocalUser -Name $account -Password $password -Description 'Disposable synthetic WAL writer'
          $users = Get-LocalGroup -SID 'S-1-5-32-545'
          if (-not (Get-LocalGroupMember -Group $users | Where-Object SID -eq $worker.SID)) { Add-LocalGroupMember -Group $users -Member $worker }
          if ($collector -eq $worker.SID) { throw 'Identity collision' }
          $root = Join-Path $env:SystemDrive "/f386-chain-$tag"
          if (Test-Path -LiteralPath $root) { throw 'Workspace already exists' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($collector)
          $acl.SetAccessRuleProtection($true,$false)
          foreach ($sid in @($collector,[Security.Principal.SecurityIdentifier]::new('S-1-5-18'))) {
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow'))
          }
          $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'ReadAndExecute','Allow'))
          Set-Acl -LiteralPath $root -AclObject $acl
          $repo = Join-Path $env:GITHUB_WORKSPACE 'f387-prisma-source'
          $repoAcl = [Security.AccessControl.DirectorySecurity]::new()
          $repoAcl.SetOwner($collector)
          $repoAcl.SetAccessRuleProtection($true,$false)
          foreach ($sid in @($collector,[Security.Principal.SecurityIdentifier]::new('S-1-5-18'))) {
            $repoAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid,'FullControl','ContainerInherit,ObjectInherit','None','Allow'))
          }
          $repoAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'ReadAndExecute','ContainerInherit,ObjectInherit','None','Allow'))
          Set-Acl -LiteralPath $repo -AclObject $repoAcl
          $inbox = New-Item -ItemType Directory -Path (Join-Path $root 'inbox')
          $sealed = New-Item -ItemType Directory -Path (Join-Path $root 'sealed')
          $inboxAcl = Get-Acl -LiteralPath $inbox.FullName
          $inboxAcl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($worker.SID,'Modify','ContainerInherit,ObjectInherit','None','Allow'))
          Set-Acl -LiteralPath $inbox.FullName -AclObject $inboxAcl
          $trial = New-Item -ItemType Directory -Path (Join-Path $inbox.FullName 'id88-trial')
          $runId = "$tag-id88"
          $temp = New-Item -ItemType Directory -Path (Join-Path $trial.FullName "f387-cleanup-solution-$runId")
          $target = Join-Path $repo 'tests/database-migration.test.ts'
          $overlay = Join-Path $repo 'tests/f387-id88-handoff.mjs'
          $probe = Join-Path $repo 'tests/f387-id88-probe.ps1'
          $config = Join-Path $repo 'f387-id88.config.mjs'
          $launch = Join-Path $repo 'f387-id88-launch.cjs'
          $case = 'lifts a v0.9.0 profile (no head) to the schema head and keeps its data'
          $patch = Join-Path $root 'candidate.patch'
          [IO.File]::WriteAllBytes($patch,[Convert]::FromBase64String(''))
          git -C $repo apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Candidate patch check failed' }
          git -C $repo apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Candidate patch application failed' }
          Write-Output 'Applied reviewed candidate patch to fixed disposable checkout only'
          @'
          param([string]$Directory)
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          public static class ID88Access {
            [StructLayout(LayoutKind.Sequential)] public struct Unique { public int pid; public System.Runtime.InteropServices.ComTypes.FILETIME start; }
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)] public struct Info {
              public Unique Process;
              [MarshalAs(UnmanagedType.ByValTStr,SizeConst=256)] public string AppName;
              [MarshalAs(UnmanagedType.ByValTStr,SizeConst=64)] public string Service;
              public uint Type; public uint Status; public uint Session;
              [MarshalAs(UnmanagedType.Bool)] public bool Restartable;
            }
            public class Owner { public int pid; public string processName; public string startUtc; }
            public class OwnerResult { public int error; public Owner[] owners; }
            [DllImport("rstrtmgr.dll",CharSet=CharSet.Unicode)] static extern int RmStartSession(out uint s,uint flags,System.Text.StringBuilder key);
            [DllImport("rstrtmgr.dll",CharSet=CharSet.Unicode)] static extern int RmRegisterResources(uint s,uint n,string[] files,uint np,IntPtr p,uint ns,IntPtr services);
            [DllImport("rstrtmgr.dll")] static extern int RmGetList(uint s,out uint needed,ref uint count,[In,Out] Info[] info,ref uint reasons);
            [DllImport("rstrtmgr.dll")] static extern int RmEndSession(uint s);
            public static OwnerResult Owners(string file) {
              uint session; int err=RmStartSession(out session,0,new System.Text.StringBuilder(33));
              if(err!=0) return new OwnerResult{error=err,owners=new Owner[0]};
              try {
                err=RmRegisterResources(session,1,new string[]{file},0,IntPtr.Zero,0,IntPtr.Zero);
                if(err!=0) return new OwnerResult{error=err,owners=new Owner[0]};
                uint needed=0,count=0,reasons=0; Info[] info=null;
                err=RmGetList(session,out needed,ref count,info,ref reasons);
                for(int retry=0;err==234 && retry<3;retry++) {
                  count=needed; info=new Info[count]; err=RmGetList(session,out needed,ref count,info,ref reasons);
                }
                if(err!=0) return new OwnerResult{error=err,owners=new Owner[0]};
                var list=new System.Collections.Generic.List<Owner>();
                for(int i=0;i<count;i++) {
                  string name=info[i].AppName;
                  try { using(var p=System.Diagnostics.Process.GetProcessById(info[i].Process.pid)) { name=p.ProcessName; } } catch {}
                  long time=((long)(uint)info[i].Process.start.dwHighDateTime<<32)|(uint)info[i].Process.start.dwLowDateTime;
                  list.Add(new Owner{pid=info[i].Process.pid,processName=name,startUtc=DateTime.FromFileTimeUtc(time).ToString("o")});
                }
                return new OwnerResult{error=0,owners=list.ToArray()};
              } finally { RmEndSession(session); }
            }
            [DllImport("kernel32.dll",CharSet=CharSet.Unicode,SetLastError=true)]
            private static extern SafeFileHandle CreateFile(string p,uint a,uint s,IntPtr sa,uint d,uint f,IntPtr t);
            public static int Probe(string p,uint a) {
              using(var h=CreateFile(p,a,7,IntPtr.Zero,3,0x02200000,IntPtr.Zero)) {
                return h.IsInvalid ? Marshal.GetLastWin32Error() : 0;
              }
            }
          }
          "@
          $rows = foreach ($name in 'conversations.db','conversations.db-wal','conversations.db-shm') {
            $p = Join-Path $Directory $name
            [ordered]@{ name=$name; readWin32=[ID88Access]::Probe($p,1); deleteAccessWin32=[ID88Access]::Probe($p,65536); restartManager=[ID88Access]::Owners($p) }
          }
          ConvertTo-Json -InputObject @($rows) -Depth 8 -Compress
          '@ | Set-Content -LiteralPath $probe -Encoding utf8
          @'
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const root = path.dirname(fileURLToPath(import.meta.url));
          const run = process.env.F387_DIAGNOSTIC_ROOT;
          if (!run) throw Error('Missing diagnostic root');
          const aliased = {'@main':'src/main','@renderer':'src/renderer','@shared':'src/shared','@preload':'src/preload','@packs':'src/packs','generated/prisma/client':'src/generated/prisma/client.ts'};
          const alias = Object.fromEntries(Object.entries(aliased).map(([k,v])=>[k,path.join(root,v)]));
          export default {root,cacheDir:path.join(run,'vite-cache'),envDir:false,resolve:{alias},optimizeDeps:{exclude:['@neuronection/assistant-ui']},test:{
            include:['tests/database-migration.test.ts'],setupFiles:['tests/setup/canvas.ts','tests/setup/react-env.ts'],environment:'node',allowOnly:true,testTimeout:30000,hookTimeout:20000,maxWorkers:1,watch:false,fileParallelism:false,cache:false,fsModuleCache:false,coverage:{enabled:false},retry:0,api:false,ui:false,open:false,pool:'forks',attachmentsDir:path.join(run,'attachments')
          }};
          '@ | Set-Content -LiteralPath $config -Encoding utf8
          @'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const fs = require('node:fs');
          const { execFileSync, spawnSync } = require('node:child_process');
          const [repo,temp,runId,sid,mode] = process.argv.slice(2);
          assert.equal(mode,'candidate');
          assert.match(runId,/^[0-9]+-1-id88$/);
          assert(!process.env.GITHUB_TOKEN && !process.env.ACTIONS_RUNTIME_TOKEN);
          const whoami = path.join(process.env.SystemRoot,'System32','whoami.exe');
          assert(execFileSync(whoami,['/user'],{encoding:'utf8'}).includes(sid));
          assert(!execFileSync(whoami,['/groups'],{encoding:'utf8'}).includes('S-1-5-32-544'));
          assert.throws(()=>{const fd=fs.openSync(path.join(repo,'package-lock.json'),'r+');fs.closeSync(fd);},{code:/^(EACCES|EPERM)$/});
          const casePattern = '^schema boot after the plan-36 flatten > lifts a v0\\.9\\.0 profile \\(no head\\) to the schema head and keeps its data$';
          const env = {...process.env,TEMP:temp,TMP:temp,TMPDIR:temp,F387_DIAGNOSTIC_ROOT:temp,F387_RUN_ID:runId,F387_GC_MODE:mode,F387_ISOLATED_ROOT:temp};
          const lock = JSON.parse(fs.readFileSync(path.join(repo,'node_modules/@prisma/adapter-libsql/node_modules/@libsql/client/package.json'),'utf8'));
          assert.equal(process.version,'v24.22.3'); assert.equal(lock.version,'0.17.4');
          const proc = spawnSync(process.execPath,[path.join(repo,'node_modules/vitest/vitest.mjs'),'run','tests/database-migration.test.ts','--config',path.join(repo,'f387-id88.config.mjs'),'--configLoader','runner','--testNamePattern',casePattern,'--maxWorkers','1','--no-file-parallelism','--no-cache','--reporter','verbose','--reporter','json','--outputFile.json',path.join(temp,'result.json')],{cwd:repo,env,stdio:'inherit',windowsHide:true});
          if (proc.error) throw proc.error;
          process.exitCode = proc.status ?? 1;
          '@ | Set-Content -LiteralPath $launch -Encoding utf8
          $node = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          if ((& $node --version) -cne 'v24.22.3') { throw 'Worker executable version mismatch' }
          $cred = [pscredential]::new("$env:COMPUTERNAME\$account",$password)
          $argsForWorker = '"{0}" "{1}" "{2}" "{3}" "{4}" "{5}"' -f $launch,$repo,$temp.FullName,$runId,$worker.SID.Value,$env:F387_GC_MODE
          $stdout = Join-Path $sealed.FullName 'worker.stdout.txt'
          $stderr = Join-Path $sealed.FullName 'worker.stderr.txt'
          $proc = Start-Process -FilePath $node -ArgumentList $argsForWorker -Credential $cred -UseNewEnvironment -WorkingDirectory $repo -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          $handoff = Join-Path $temp.FullName 'fixture-handoff.json'
          $sources = @{}
          foreach ($name in 'fixture-handoff.json','result.json') {
            $candidate = Join-Path $temp.FullName $name
            if (Test-Path -LiteralPath $candidate) { $sources[$name] = $candidate }
          }
          if (Test-Path -LiteralPath $handoff -PathType Leaf) {
            $h = Get-Content -LiteralPath $handoff -Raw | ConvertFrom-Json
            if ($h.directory -cnotmatch '^db-v090-lift-[A-Za-z0-9]+$' -or $h.pid -le 0) { throw 'Invalid candidate handoff' }
            $directory = Get-Item -LiteralPath (Join-Path $temp.FullName $h.directory) -Force
            if (-not $directory.PSIsContainer -or ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Invalid source directory' }
            $after = & (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -File $probe $directory.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Post-exit probe failed' }
            Set-Content -LiteralPath (Join-Path $sealed.FullName 'after-exit.json') -Value $after -Encoding utf8
            Write-Output ('Post-exit file owners '+$after)
            foreach ($name in 'conversations.db','conversations.db-wal','conversations.db-shm') {
              $candidate = Join-Path $directory.FullName $name
              if (Test-Path -LiteralPath $candidate) { $sources[$name] = $candidate }
            }
          }
          $held=@{}
          try {
            foreach ($name in $sources.Keys) {
              $item = Get-Item -LiteralPath $sources[$name] -Force
              if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $item.Length -gt 10000000) { throw 'Invalid file in seal inventory' }
              $held[$name] = [IO.File]::Open($item.FullName,'Open','Read','Read')
            }
            foreach ($name in $held.Keys) {
              $out = [IO.File]::Open((Join-Path $sealed.FullName $name),'CreateNew','Write','None')
              try { $held[$name].CopyTo($out) } finally { $out.Dispose() }
            }
          } finally { foreach ($stream in $held.Values) { $stream.Dispose() } }
          $candidateModule = Join-Path $root 'candidate-boundary.cjs'
          [IO.File]::WriteAllBytes($candidateModule,[Convert]::FromBase64String(''))
          $candidateCollector = Join-Path $root 'candidate-collector.cjs'
          [IO.File]::WriteAllBytes($candidateCollector,[Convert]::FromBase64String(''))
          & $node $candidateCollector $root $sealed.FullName $proc.Id $proc.ExitCode
          if ($LASTEXITCODE -ne 0) { throw 'Candidate boundary integration failed; source retained' }
          $inventory = @(Get-ChildItem -LiteralPath $sealed.FullName -File | Sort-Object Name | ForEach-Object { [ordered]@{name=$_.Name;bytes=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()} })
          $manifest = Join-Path $sealed.FullName 'manifest.json'
          [ordered]@{runId=$runId;mode=$env:F387_GC_MODE;workerSid=$worker.SID.Value;collectorSid=$collector.Value;exitCode=$proc.ExitCode;sourceSha='91daf54c96935a8b69a84d4f364a831ccf120d61';files=$inventory} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifest -Encoding utf8
          "sealed=$($sealed.FullName)" >> $env:GITHUB_OUTPUT
          "manifest_sha=$((Get-FileHash -LiteralPath $manifest).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Output "ID 88 worker exit $($proc.ExitCode); original synthetic fixture is retained"
      - name: Upload only sealed ID 88 evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: id88-${{ github.run_id }}-${{ github.run_attempt }}-candidate
          path: |
            ${{ steps.seal.outputs.sealed }}/manifest.json
            ${{ steps.seal.outputs.sealed }}/worker.stdout.txt
            ${{ steps.seal.outputs.sealed }}/worker.stderr.txt
            ${{ steps.seal.outputs.sealed }}/fixture-handoff.json
            ${{ steps.seal.outputs.sealed }}/candidate-boundary-state.json
            ${{ steps.seal.outputs.sealed }}/candidate-boundary-manifest.json
            ${{ steps.seal.outputs.sealed }}/after-exit.json
            ${{ steps.seal.outputs.sealed }}/result.json
            ${{ steps.seal.outputs.sealed }}/conversations.db
            ${{ steps.seal.outputs.sealed }}/conversations.db-wal
            ${{ steps.seal.outputs.sealed }}/conversations.db-shm
          retention-days: 14
          if-no-files-found: error
          overwrite: false

  id88_verify:
    needs: id88
    if: ${{ always() && needs.id88.outputs.archive_id != '' }}
    runs-on: windows-2022
    permissions: {}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: id88-${{ github.run_id }}-${{ github.run_attempt }}-candidate
          path: ${{ runner.temp }}/id88-download-${{ env.F386_RUN }}
      - name: Verify the one selected result and restore a fresh copy
        shell: pwsh
        env:
          MANIFEST_SHA: ${{ needs.id88.outputs.manifest_sha }}
          EXPECTED_MODE: candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = Join-Path $env:RUNNER_TEMP "id88-download-$env:F386_RUN"
          $manifest = Join-Path $dir 'manifest.json'
          if ((Get-FileHash -LiteralPath $manifest).Hash -ine $env:MANIFEST_SHA) { throw 'Manifest mismatch' }
          $doc = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($doc.runId -cne "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-id88" -or $doc.workerSid -ceq $doc.collectorSid) { throw 'Run or identity mismatch' }
          $allowed = @('worker.stdout.txt','worker.stderr.txt','fixture-handoff.json','candidate-boundary-state.json','candidate-boundary-manifest.json','after-exit.json','result.json','conversations.db','conversations.db-wal','conversations.db-shm')
          foreach ($f in $doc.files) {
            if ($f.name -cnotin $allowed) { throw 'Unexpected filename' }
            $p = Join-Path $dir $f.name
            if ((Get-Item -LiteralPath $p).Length -ne $f.bytes -or (Get-FileHash -LiteralPath $p).Hash -ine $f.sha256) { throw 'File mismatch' }
          }
          if (@(Compare-Object @($doc.files.name + 'manifest.json' | Sort-Object) @(Get-ChildItem -LiteralPath $dir -Force | Select-Object -ExpandProperty Name | Sort-Object) -CaseSensitive).Count) { throw 'Archive inventory mismatch' }
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'result.json'))) { throw 'Diagnostic runner produced no Vitest result; inspect retained evidence' }
          $state = Get-Content -LiteralPath (Join-Path $dir 'candidate-boundary-state.json') -Raw | ConvertFrom-Json
          $boundary = Get-Content -LiteralPath (Join-Path $dir 'candidate-boundary-manifest.json') -Raw | ConvertFrom-Json
          if ($doc.mode -cne 'candidate' -or -not $state.candidateApplied -or -not $state.snapshotVerified -or $state.cleanupCapabilityIssued -or $state.manualDeletionPerformed -or $state.naturalExit.exitCode -ne 0 -or $boundary.mode -cne 'post-natural-exit') { throw 'Candidate integration state invalid' }
          foreach ($f in $boundary.files) {
            $outer = @($doc.files | Where-Object name -ceq $f.name)
            if ($outer.Count -ne 1 -or $outer[0].sha256 -cne $f.sha256 -or $outer[0].bytes -ne $f.bytes) { throw 'Boundary snapshot does not match preserved original bytes' }
          }
          Write-Output ('Candidate boundary '+($state | ConvertTo-Json -Depth 8 -Compress))

          $result = Get-Content -LiteralPath (Join-Path $dir 'result.json') -Raw | ConvertFrom-Json
          $ran = @($result.testResults.assertionResults | Where-Object { $_.status -in 'passed','failed' })
          if ($ran.Count -ne 1 -or $ran[0].title -cne 'lifts a v0.9.0 profile (no head) to the schema head and keeps its data' -or @($ran[0].ancestorTitles)[-1] -cne 'schema boot after the plan-36 flatten') { throw 'Exact one-case scope not verified' }
          Write-Output ('After exit '+(Get-Content -LiteralPath (Join-Path $dir 'after-exit.json') -Raw))
          Write-Output "ID 88 outcome $($ran[0].status); skipped $($result.numPendingTests); worker exit $($doc.exitCode)"
          if (Test-Path -LiteralPath (Join-Path $dir 'pre-cleanup.json')) { Get-Content -LiteralPath (Join-Path $dir 'pre-cleanup.json') }
          if ($ran[0].status -ne 'passed' -or $doc.exitCode -ne 0) { throw 'ID 88 did not pass; original evidence retained' }
          $script = Join-Path $env:RUNNER_TEMP 'f387-id88-restore.cjs'
          @'
          const fs=require('node:fs'); const path=require('node:path'); const os=require('node:os');
          const assert=require('node:assert/strict'); const {DatabaseSync}=require('node:sqlite');
          const input=process.argv[2]; const root=fs.mkdtempSync(path.join(os.tmpdir(),'id88-restore-'));
          for (const name of ['conversations.db','conversations.db-wal','conversations.db-shm']) {
            const p=path.join(input,name);
            if (name==='conversations.db'||fs.existsSync(p)) fs.copyFileSync(p,path.join(root,name),fs.constants.COPYFILE_EXCL);
          }
          const db=new DatabaseSync(path.join(root,'conversations.db'));
          try {
            const integrity=db.prepare('PRAGMA integrity_check').get().integrity_check;
            const version=db.prepare('PRAGMA user_version').get().user_version;
            const conversation=db.prepare("SELECT id,title,activeRootId FROM Conversation WHERE id='conv-legacy'").get();
            const message=db.prepare("SELECT id,content,parentId,activeChildId FROM Message WHERE id='msg-legacy'").get();
            assert.equal(integrity,'ok'); assert.equal(version,7);
            assert.deepEqual({...conversation},{id:'conv-legacy',title:'Before the head',activeRootId:null});
            assert.deepEqual({...message},{id:'msg-legacy',content:'Kept across the lift',parentId:null,activeChildId:null});
            console.log(JSON.stringify({integrity,version,conversation,message}));
          } finally { db.close(); }
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          node $script $dir


