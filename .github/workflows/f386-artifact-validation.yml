name: F39 provider identity Windows candidate build only
on:
  push:
    branches:
      - audit/f386-artifact-validation
permissions:
  contents: read
concurrency:
  group: f39-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'seanchc418/desktop-assistant' && github.event.head_commit.message == 'Build approved provider identity Windows candidate only' && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: neuronection/desktop-assistant
          ref: 68532047c6547cbf8685adbe40e3cad3fad1ea32
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.3
          architecture: x64
      - name: Build and package reviewed port without launching the app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          if ((git rev-parse HEAD) -cne '68532047c6547cbf8685adbe40e3cad3fad1ea32') { throw 'Unexpected source' }
          $patch=Join-Path $env:RUNNER_TEMP 'provider-identity.patch'
          [IO.File]::WriteAllBytes($patch,[Convert]::FromBase64String(''))
          if ((Get-FileHash -LiteralPath $patch).Hash -ine '31d87ef672e03b7cebd73428bb79c6b38c112e79266a49c5f8eaaa35557ce9a0') { throw 'Patch bytes mismatch' }
          git apply --check $patch
          git apply $patch
          $lockBefore=(Get-FileHash -LiteralPath 'package-lock.json').Hash
          npx.cmd --yes npm@11.6.2 ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
          node node_modules/patch-package/index.js
          node node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
          npm.cmd run lint
          npm.cmd run typecheck
          npm.cmd run build
          if ((Get-FileHash -LiteralPath 'package-lock.json').Hash -cne $lockBefore) { throw 'Lockfile changed' }
          $env:CSC_IDENTITY_AUTO_DISCOVERY='false'
          node node_modules/electron-builder/cli.js --win nsis --x64 --publish never '-c.win.artifactName=Desktop-Assistant-provider-identity-candidate-0.13.0-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $release=(Resolve-Path -LiteralPath 'release').Path
          $bins=@(Get-ChildItem -LiteralPath $release -File -Recurse | Where-Object Extension -in '.exe','.dll','.node')
          $signatures=@(foreach($file in $bins){$sig=Get-AuthenticodeSignature -LiteralPath $file.FullName;[ordered]@{path=[IO.Path]::GetRelativePath($release,$file.FullName);status=[string]$sig.Status;signer=$sig.SignerCertificate.Subject;sha256=(Get-FileHash -LiteralPath $file.FullName).Hash.ToLowerInvariant()}})
          $signatures | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'release/signature-inventory.json' -Encoding utf8
          $installers=@(Get-ChildItem -LiteralPath $release -Filter '*candidate*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one candidate installer' }
          $hash=(Get-FileHash -LiteralPath $installers[0].FullName).Hash.ToLowerInvariant()
          [ordered]@{sourceSha='68532047c6547cbf8685adbe40e3cad3fad1ea32';baseVersion='0.13.0';patchSha256='31d87ef672e03b7cebd73428bb79c6b38c112e79266a49c5f8eaaa35557ce9a0';installer=$installers[0].Name;installerSha256=$hash;node=(node --version);electron=(node -p "require('./node_modules/electron/package.json').version");electronBuilder=(node -p "require('./node_modules/electron-builder/package.json').version");status='unsigned experimental build, not approved for installation';appLaunched=$false;testsRun=$false;published=$false} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'release/candidate-provenance.json' -Encoding utf8
      - name: Save only candidate installer and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f39-provider-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            release/*candidate*-setup.exe
            release/candidate-provenance.json
            release/signature-inventory.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
          overwrite: false
